name: CI

on:
  pull_request:
    paths: &paths
      - ".github/workflows/CI.yml"
      - ".github/workflows/CommonCI.yml"
      - "ext/**"
      - "lib/**"
      - "src/**"
      - "test/**"
      - "Project.toml"
  push:
    branches:
      - main
      - release-*
    tags: ["*"]
    paths: *paths

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
  
jobs:
  test_hardware_sweep:
    name: test
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.10"
          - "1.13-nightly"
        os:
          - ubuntu-24.04
          - ubuntu-22.04-arm
          - macOS-latest
          - windows-latest
          - linux-x86-ct6e-180-4tpu
        test_group: [core, nn, integration, probprog]
        runtime: [pjrt, ifrt]
    uses: ./.github/workflows/CommonCI.yml
    with:
      julia_version: ${{ matrix.version }}
      os: ${{ matrix.os }}
      runtime: ${{ matrix.runtime }}
      test_args: ${{ matrix.test_group == 'core' && 'core plugins' || matrix.test_group }}

  test_version_sweep:
    name: test
    strategy:
      fail-fast: false
      matrix:
        version: ["1.11", "1.12"]
        os: ["ubuntu-24.04"]
        test_group: [core, nn, integration, probprog]
        runtime: [pjrt, ifrt]
    uses: ./.github/workflows/CommonCI.yml
    with:
      julia_version: ${{ matrix.version }}
      os: ${{ matrix.os }}
      runtime: ${{ matrix.runtime }}
      test_args: ${{ matrix.test_group == 'core' && 'core plugins' || matrix.test_group }}

  test_winversion_sweep:
    name: test
    strategy:
      fail-fast: false
      matrix:
        version: ["1.11", "1.12"]
        os: ["windows-latest"]
        test_group: [core, integration]
        runtime: [pjrt]
    uses: ./.github/workflows/CommonCI.yml
    with:
      julia_version: ${{ matrix.version }}
      os: ${{ matrix.os }}
      runtime: ${{ matrix.runtime }}
      test_args: ${{ matrix.test_group == 'core' && 'core plugins' || matrix.test_group }}
      
  # This has been broken for a while, originating from CUDA.jl
  # test-assertions:
  #   strategy:
  #     fail-fast: false
  #     matrix:
  #       version:
  #         - "1.10"
  #       test_group:
  #         - core
  #         - nn
  #         - integration
  #   uses: ./.github/workflows/CommonCI.yml
  #   with:
  #     julia_version: ${{ matrix.version }}
  #     os: "ubuntu-24.04"
  #     runtime: "both"
  #     assertions: true
  #     test_args: ${{ matrix.test_group == 'core' && 'core plugins' || matrix.test_group }}

  downgrade:
    strategy:
      fail-fast: false
      matrix:
        test_group:
          - core
          - nn
          - integration
          - probprog
        runtime:
          - "pjrt"
          - "ifrt"
    uses: ./.github/workflows/CommonCI.yml
    with:
      julia_version: "1.10"
      os: "ubuntu-24.04"
      runtime: ${{ matrix.runtime }}
      test_args: ${{ matrix.test_group == 'core' && 'core plugins' || matrix.test_group }}
      downgrade_testing: true
