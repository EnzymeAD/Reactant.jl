# Throwaway investigation workflow: find *why* the ReactantCUDAExt pkgimage
# fails to link on Windows + Julia 1.11.
#
#   lld: error: undefined symbol: jl_boxed_uint8_cache
#   >>> referenced by jl_XXXX.tmp(text#0.o):(.refptr.jl_boxed_uint8_cache)
#
# Round 1 established that the precompile flags are irrelevant (a plain load
# reproduces) and that the ReactantCUDAExt @compile_workload is the source.
# Round 2 captures the pkgimage archive before lld sees it, so the emitting
# function can be identified rather than guessed -- disabling the workload is a
# workaround, but any package precompiling GPU kernels could hit the same bug.
#
# NOT FOR MERGE.
name: win111 repro

on:
  push:
    branches:
      - "wsmoses/win111-repro**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dissect:
    name: dissect
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: julia-actions/setup-julia@v3
        with:
          version: "1.11"

      # No julia-actions/cache: a restored pkgimage would hide the failure.

      - name: "Install dependencies"
        shell: bash
        timeout-minutes: 60
        env:
          JULIA_PKG_PRECOMPILE_AUTO: "0"
        run: |
          set -euo pipefail
          julia --color=yes --project=. -e 'import Pkg; Pkg.Registry.update(); Pkg.instantiate()'
          julia --color=yes --project=test -e 'import Pkg; Pkg.instantiate()'

      # Precompile everything else first, so the capture pass only has to
      # rebuild ReactantCUDAExt (which fails, and so is retried every load).
      - name: "Warm up (everything except the failing extension)"
        shell: bash
        timeout-minutes: 60
        run: |
          julia --color=yes --project=test .github/win111_probe.jl || true

      - name: "Capture pkgimage archive"
        shell: bash
        timeout-minutes: 30
        env:
          PKGIMG_CAPTURE_DIR: capture
        run: |
          set -o pipefail
          julia --color=yes --project=test .github/win111_dissect.jl 2>&1 | tee dissect.log || true
          echo "=== captured ==="
          ls -la capture/ || true

      # Immediate answer in the log; the artifact allows deeper offline work.
      - name: "Locate the reference"
        if: always()
        shell: bash
        run: |
          LLVM="/c/Program Files/LLVM/bin"
          echo "llvm-objdump: $("$LLVM/llvm-objdump" --version 2>&1 | head -2 || echo MISSING)"
          mkdir -p dis
          for a in capture/*.a; do
            [ -e "$a" ] || continue
            echo "##### archive $a"
            "$LLVM/llvm-ar" t "$a" || continue
            ( cd dis && "$LLVM/llvm-ar" x "../$a" ) || continue
            for m in dis/*; do
              [ -f "$m" ] || continue
              if "$LLVM/llvm-objdump" -r "$m" 2>/dev/null | grep -q "jl_boxed_uint8_cache"; then
                echo "##### FOUND jl_boxed_uint8_cache relocation in $m"
                # Disassemble with relocations and show the enclosing symbol.
                "$LLVM/llvm-objdump" -d -r "$m" > "$m.dis" 2>/dev/null || true
                grep -n -B 60 "jl_boxed_uint8_cache" "$m.dis" \
                  | grep -E "^[0-9]+-[0-9a-f]{16} <|jl_boxed_uint8_cache" \
                  | tail -40
              fi
            done
            rm -rf dis; mkdir -p dis
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pkgimage-capture
          path: |
            capture/
            dissect.log
          retention-days: 14
