name: CI (Enzyme-JAX Nightly)

on:
  pull_request:
    paths: &paths
      - "ext/**"
      - "lib/**"
      - "src/**"
      - "test/**"
      - "Project.toml"
  push:
    branches:
      - main
      - release-*
    paths: *paths
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test-nightly-cpu:
    name: Nightly CPU
    uses: ./.github/workflows/CommonCI.yml
    with:
      julia_version: "1.12"
      os: linux-x86-n4-32
      runtime: "both"
      assertions: false
      localjll: true
      libreactant_url: https://github.com/EnzymeAD/Enzyme-JAX/releases/download/nightly/libreactant-linux-x86_64-cpu.tar.zst

  test-nightly-gpu:
    name: Nightly GPU (CUDA 13)
    uses: ./.github/workflows/CommonCI.yml
    with:
      julia_version: "1.12"
      os: linux-x86-a2-48-a100-4gpu
      runtime: "both"
      assertions: false
      localjll: true
      libreactant_url: https://github.com/EnzymeAD/Enzyme-JAX/releases/download/nightly/libreactant-linux-x86_64-cuda13.tar.zst
