name: Bazel files check

# NOT FOR MERGE: scoped to main on the win111-repro investigation branch so the
# only jobs that run there are the Windows probes. Restore `on: [push]`.
on:
  push:
    branches:
      - main

jobs:
  formatting-check:
    name: Formatting Bazel files check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Setup buildifier
      uses: jbajic/setup-buildifier@v1

    - name: Run buildifier
      run: |
        buildifier -mode check -r .
